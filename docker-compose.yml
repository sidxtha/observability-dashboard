version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: obs_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: observability_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: obs_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: